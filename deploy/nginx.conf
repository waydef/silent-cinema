# server block for nginx in front of silent.cinema (BIND=127.0.0.1, TRUST_PROXY=1).
# the certificate lines assume certbot.
server {
    listen 443 ssl;
    http2 on;
    server_name cinema.example.com;

    ssl_certificate     /etc/letsencrypt/live/cinema.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinema.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # video segments stream straight through instead of being buffered to disk
        proxy_buffering off;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
