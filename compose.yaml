services:
  silent-cinema:
    build: .
    image: silent-cinema
    restart: unless-stopped
    ports:
      # viewers; put a reverse proxy with https in front of it
      - "8080:8080"
      # the host page: loopback of the docker host only, reach it over ssh -L 8088:127.0.0.1:8088
      - "127.0.0.1:8088:8088"
    volumes:
      - ./films:/media:ro
      - data:/data
    environment:
      # the address the host page tells people to open
      # PUBLIC_URL: https://cinema.example.com
      # set when a reverse proxy on this machine is the only way to port 8080
      # TRUST_PROXY: "1"
      # extra names for the host page, when port 8088 is published on a lan address
      # HOST_HOSTS: "nas.local"
      # HOST_NAME: "host"

volumes:
  data:
